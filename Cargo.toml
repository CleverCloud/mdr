[package]
name = "mdr"
version = "0.4.0"
edition = "2021"
rust-version = "1.95"
description = "A lightweight Markdown viewer with live reload and multiple rendering backends"
license = "MIT"
repository = "https://github.com/CleverCloud/mdr"
homepage = "https://github.com/CleverCloud/mdr"
readme = "README.md"
authors = ["Clever Cloud <opensource@clever-cloud.com>"]
categories = ["command-line-utilities", "text-processing"]
keywords = ["markdown", "viewer", "mermaid", "tui", "webview"]

[features]
default = ["egui-backend", "webview-backend", "tui-backend"]
egui-backend = [
  "dep:eframe",
  "dep:egui_commonmark",
  "dep:resvg",
  "dep:usvg",
  "dep:tiny-skia",
  "dep:fontdb",
  "dep:ureq",
]
webview-backend = [
  "dep:wry",
  "dep:tao",
  "dep:muda",
  "dep:resvg",
  "dep:usvg",
  "dep:tiny-skia",
  "dep:ureq",
]
tui-backend = [
  "dep:ratatui",
  "dep:crossterm",
  "dep:ratatui-image",
  "dep:ureq",
  "dep:resvg",
  "dep:usvg",
  "dep:tiny-skia",
  "image/jpeg",
  "image/gif",
  "image/webp",
]

[dependencies]
# Core
clap = { version = "4", features = ["derive"] }
comrak = { version = "0.52", default-features = false, features = ["syntect"] }
notify = "8"
notify-debouncer-mini = "0.7"
mermaid-rs-renderer = { version = "0.2", default-features = false }
regex = "1"
serde_json = "1"
base64 = "0.22"
kdl = "6"

# egui backend
eframe = { version = "0.34", features = ["persistence"], optional = true }
egui_commonmark = { version = "0.23", features = [
  "better_syntax_highlighting",
  "load-images",
  "svg",
  "embedded_image",
], optional = true }
resvg = { version = "0.47", optional = true }
usvg = { version = "0.47", optional = true }
tiny-skia = { version = "0.12", optional = true }
fontdb = { version = "0.23", optional = true }

# webview backend
wry = { version = "0.55", optional = true }
tao = { version = "0.35", optional = true }
muda = { version = "0.19", optional = true }

# tui backend
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
ratatui-image = { version = "11.0", default-features = false, features = [
  "image-defaults",
  "crossterm",
], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[package.metadata.deb]
section = "text"
# `$auto` covers everything the binary links directly (GTK 3, WebKitGTK, libxdo,
# glib…). libGL/libEGL are opened with dlopen() at runtime by x11-dl and
# khronos-egl, so `ldd` cannot see them and they must be listed by hand.
depends = "$auto, libgl1, libegl1"
# `target/release/...` is rewritten to `target/<triple>/release/...` by cargo-deb
# when it is invoked with `--target`.
assets = [
  ["target/release/mdr", "/usr/bin/mdr", "755"],
  ["assets/mdr.desktop", "/usr/share/applications/mdr.desktop", "644"],
  [
    "assets/logo-128.png",
    "/usr/share/icons/hicolor/128x128/apps/mdr.png",
    "644",
  ],
  ["assets/mdr.1", "/usr/share/man/man1/mdr.1", "644"],
  ["README.md", "/usr/share/doc/mdr/README.md", "644"],
]
extended-description = "A lightweight Markdown viewer with Mermaid diagram support, live reload, and multiple rendering backends (egui, webview, TUI)."

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/mdr", dest = "/usr/bin/mdr", mode = "0755" },
  { source = "assets/mdr.desktop", dest = "/usr/share/applications/mdr.desktop", mode = "0644" },
  { source = "assets/logo-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/mdr.png", mode = "0644" },
  { source = "assets/mdr.1", dest = "/usr/share/man/man1/mdr.1", mode = "0644", doc = true },
  { source = "README.md", dest = "/usr/share/doc/mdr/README.md", mode = "0644", doc = true },
]
# auto-req is left at its default ("auto"), which detects the shared libraries
# the binary links against — that is where `libxdo.so.3()(64bit)`,
# `libgtk-3.so.0()(64bit)`, `libwebkit2gtk-4.1.so.0()(64bit)`… come from.
# It relies on ldd, so libraries opened with dlopen() at runtime (libGL/libEGL,
# via x11-dl and khronos-egl) are invisible to it and are declared explicitly.
# On Fedora these sonames are provided by mesa-libGL and mesa-libEGL.
[package.metadata.generate-rpm.requires]
"libGL.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
