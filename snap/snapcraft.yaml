name: mdr-markdown-renderer
base: core22
adopt-info: mdr
summary: A lightweight Markdown viewer with live reload
description: |
  A lightweight Markdown viewer with Mermaid diagram support,
  live reload, and multiple rendering backends (egui, webview, TUI).
grade: stable
confinement: strict

apps:
  mdr-markdown-renderer:
    command: bin/mdr
    aliases: [mdr]
    # The gnome extension is what exports the runtime environment the snap
    # needs to reach the Wayland socket, the xkb keymaps and the Mesa drivers
    # it already ships. Without it the app cannot start on a stock GNOME
    # Wayland desktop (#47): winit reports "Could not find wayland
    # compositor", then panics on XKBNotFound, then wgpu fails to create a
    # surface. The extension also pulls GTK and its themes from the
    # gnome-42-2204 content snap, so those no longer have to be staged here.
    extensions: [gnome]
    plugs:
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - home
      - network
      - browser-support
      - opengl

parts:
  mdr:
    plugin: rust
    source: .
    build-packages:
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libxdo-dev
      - libgl1-mesa-dev
    stage-packages:
      - libgtk-3-0
      - libwebkit2gtk-4.1-0
      - libxdo3
      - libgl1
    override-pull: |
      craftctl default
      craftctl set version="$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')"
